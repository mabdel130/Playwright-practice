version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ['@playwright/*', 'playwright*', 'allure-*']
      lint:
        patterns: ['eslint*', 'typescript*', '@eslint/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
