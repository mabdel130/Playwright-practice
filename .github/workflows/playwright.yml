name: Playwright Tests

on:
  push:
    branches: [main, 'Task*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 1,15 * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        default: 'test'
        type: choice
        options: [dev, test, staging, prod]
      browsers:
        description: 'Browsers to run'
        default: 'chromium'
        type: choice
        options: [chromium, all]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run verify

  test:
    needs: verify
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.environment || 'test' }}
      BROWSERS: ${{ inputs.browsers || 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps ${{ env.BROWSERS == 'chromium' && 'chromium' || '' }}

      - name: Restore trend history
        uses: actions/cache/restore@v4
        with:
          path: |
            allure-results/history
            test-results/flaky-history.json
          key: trend-${{ env.TEST_ENV }}-${{ github.run_id }}
          restore-keys: trend-${{ env.TEST_ENV }}-

      - name: Run tests
        run: npx playwright test tests/suites ${{ env.BROWSERS == 'chromium' && '--project=chromium' || '' }}

      - name: Metrics and Allure report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          node scripts/metrics.js >> "$GITHUB_STEP_SUMMARY"
          npm run allure:generate
          mkdir -p allure-results/history && cp -r allure-report/history/. allure-results/history/

      - name: Save trend history
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            allure-results/history
            test-results/flaky-history.json
          key: trend-${{ env.TEST_ENV }}-${{ github.run_id }}

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ env.TEST_ENV }}-${{ env.BROWSERS }}
          path: |
            playwright-report/
            allure-report/
            test-results/
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf-8') : '');
            const results = read('test-results/results.json');
            const s = results && JSON.parse(results).stats;
            const summary = s
              ? `✅ ${s.expected} passed · ❌ ${s.unexpected} failed · ⚠️ ${s.flaky} flaky · ⏭️ ${s.skipped} skipped`
              : '⚠️ No results file was produced.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## 📊 Test Results (${process.env.TEST_ENV}, ${process.env.BROWSERS})\n\n${summary}\n\n${read('test-results/metrics.md')}\n\nReports are in the **reports** artifact of [this run](${runUrl}).`,
            });
