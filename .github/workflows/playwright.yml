name: Playwright Tests

on:
  push:
    branches: [main, 'Task*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test
        continue-on-error: true

      - name: Generate test report
        if: always()
        run: npx playwright show-report
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Allure results (for future trend analysis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Upload test results (JUnit & JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const playwrightReportPath = 'playwright-report/index.html';
            const allureReportPath = 'allure-report/index.html';

            let comment = '## 📊 Test Results\n\n';

            if (fs.existsSync(playwrightReportPath)) {
              comment += '✅ **Playwright HTML Report** — Generated and attached as artifact\n\n';
            }

            if (fs.existsSync(allureReportPath)) {
              comment += '✅ **Allure Report** — Generated with screenshots and logs\n\n';
              comment += '### Available Reports:\n';
              comment += '- 📋 **playwright-report** — HTML test report with timeline\n';
              comment += '- 📸 **allure-report** — Rich report with screenshots & logs on failure\n';
              comment += '- 📊 **test-results** — JUnit XML & JSON results\n\n';
              comment += 'Download artifacts from the Actions tab to view detailed reports.\n';
            } else {
              comment += '⚠️ Reports could not be generated.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true
