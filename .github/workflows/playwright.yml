name: Playwright Tests

on:
  push:
    branches: [main, 'Task*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'test'
        type: choice
        options:
          - dev
          - test
          - staging
          - prod
      browsers:
        description: 'Browsers to run'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - all

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      BROWSERS: ${{ github.event.inputs.browsers || 'chromium' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve browser list
        run: |
          if [ "$BROWSERS" = "all" ]; then
            echo "PW_INSTALL=chromium firefox webkit" >> "$GITHUB_ENV"
            echo "PW_PROJECTS=" >> "$GITHUB_ENV"
          else
            echo "PW_INSTALL=chromium" >> "$GITHUB_ENV"
            echo "PW_PROJECTS=--project=chromium" >> "$GITHUB_ENV"
          fi

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ env.BROWSERS }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps $PW_INSTALL

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps $PW_INSTALL

      - name: Run Playwright tests
        run: npx playwright test tests/suites $PW_PROJECTS

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ env.TEST_ENV }}-${{ env.BROWSERS }}
          path: |
            playwright-report/
            allure-report/
            test-results/
          retention-days: 14

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = '';
            if (fs.existsSync('test-results/results.json')) {
              const { stats } = JSON.parse(fs.readFileSync('test-results/results.json', 'utf-8'));
              summary = `✅ ${stats.expected} passed · ❌ ${stats.unexpected} failed · ⚠️ ${stats.flaky} flaky · ⏭️ ${stats.skipped} skipped`;
            } else {
              summary = '⚠️ No results file was produced.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Test Results (${process.env.TEST_ENV}, ${process.env.BROWSERS})\n\n${summary}\n\nReports (Playwright HTML, Allure, JUnit/JSON) are in the **reports** artifact of [this run](${runUrl}).`,
            });
